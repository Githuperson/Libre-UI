<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Libre UI</title>
    <meta name="description" content="Libre UI — a clean interface for LibreY search.">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <a class="logo" href="./">Libre UI</a>

        <form id="searchForm" class="search-bar">
            <input
                id="searchInput"
                type="search"
                placeholder="Search the web..."
                autocomplete="off"
                required
            >

            <button type="submit">Search</button>
        </form>
    </header>

    <main>
        <div id="status"></div>

        <div id="results"></div>

        <div id="pagination" class="pagination" hidden>
            <button id="previousButton">← Previous</button>
            <span id="pageNumber"></span>
            <button id="nextButton">Next →</button>
        </div>
    </main>

    <footer>
        <p>
            Libre UI uses the
            <a
                href="https://github.com/Ahwxorg/LibreY"
                target="_blank"
                rel="noopener noreferrer"
            >
                LibreY API
            </a>.
        </p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
